<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Biologitest – NO-Upptäckaren</title>

  <link rel="stylesheet" href="style.css">

  <style>
    :root {
      --green: #286b45;
      --light-green: #edf7ef;
      --border: #d8e5da;
      --text: #203020;
    }

    body {
      color: var(--text);
    }

    .test-container {
      max-width: 850px;
      margin: 0 auto;
      padding: 24px;
    }

    .test-header,
    .question-card,
    .result-card {
      background: white;
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 22px;
    }

    .test-header {
      background: var(--light-green);
    }

    .progress-track {
      height: 12px;
      background: #e4e9e4;
      border-radius: 20px;
      overflow: hidden;
      margin: 20px 0;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--green);
      transition: width 0.25s ease;
    }

    .question-number {
      color: var(--green);
      font-weight: bold;
      margin-bottom: 10px;
    }

    .question-text {
      font-size: 1.25rem;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .answer-list {
      display: grid;
      gap: 12px;
    }

    .answer-button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 16px;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      font-size: 1rem;
      cursor: pointer;
    }

    .answer-button:hover:not(:disabled),
    .answer-button:focus-visible {
      border-color: var(--green);
      background: var(--light-green);
    }

    .answer-button:disabled {
      cursor: default;
      opacity: 1;
    }

    .answer-button.correct {
      border-color: #23834a;
      background: #e5f6e9;
    }

    .answer-button.incorrect {
      border-color: #b83232;
      background: #fff0f0;
    }

    .feedback {
      display: none;
      margin-top: 18px;
      padding: 16px;
      border-radius: 12px;
      line-height: 1.6;
    }

    .feedback.visible {
      display: block;
    }

    .feedback.good {
      background: #e5f6e9;
      border: 1px solid #23834a;
    }

    .feedback.try-again {
      background: #fff4df;
      border: 1px solid #c58a22;
    }

    .test-button {
      display: inline-block;
      padding: 14px 22px;
      border: 0;
      border-radius: 12px;
      background: var(--green);
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .test-button:hover,
    .test-button:focus-visible {
      background: #1d5033;
    }

    .test-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .result-card {
      display: none;
      text-align: center;
      background: var(--light-green);
    }

    .result-card.visible {
      display: block;
    }

    .result-score {
      font-size: 2.5rem;
      font-weight: bold;
      color: var(--green);
      margin: 12px 0;
    }

    .result-message {
      font-size: 1.1rem;
      line-height: 1.6;
    }

    .test-navigation {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
    }

    .back-links {
      margin-top: 30px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .back-links a {
      display: inline-block;
      padding: 10px 16px;
      background: #eef2f5;
      border-radius: 10px;
      color: #203040;
      text-decoration: none;
    }

    @media (max-width: 600px) {
      .test-container {
        padding: 14px;
      }

      .test-header,
      .question-card,
      .result-card {
        padding: 18px;
      }
    }
  </style>
</head>

<body>
  <main class="test-container">

    <header class="test-header">
      <h1>Biologitest</h1>

      <p>
        Testa dina kunskaper om växter, djur, celler,
        ekologi och naturvetenskapliga undersökningar.
      </p>

      <p>
        <strong>Så gör du:</strong>
        Läs frågan. Välj ett svar. Läs återkopplingen.
      </p>

      <div class="progress-track" aria-label="Testets progression">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <p id="progressText" aria-live="polite">
        Fråga 1 av 15
      </p>
    </header>

    <section class="question-card" id="questionCard">
      <div class="question-number" id="questionNumber">
        FRÅGA 1
      </div>

      <h2 class="question-text" id="questionText"></h2>

      <div class="answer-list" id="answerList"></div>

      <div
        class="feedback"
        id="feedback"
        role="status"
        aria-live="polite"
      ></div>

      <div class="test-navigation">
        <button
          class="test-button"
          id="nextButton"
          type="button"
          disabled
        >
          Nästa fråga
        </button>
      </div>
    </section>

    <section class="result-card" id="resultCard">
      <h2>Du är klar!</h2>

      <p class="result-score" id="resultScore"></p>

      <p class="result-message" id="resultMessage"></p>

      <button
        class="test-button"
        id="restartButton"
        type="button"
      >
        Gör testet igen
      </button>
    </section>

    <footer class="back-links">
      <a href="biologi.html">Till biologin</a>
      <a href="biologibegrepp.html">Träna biologiska begrepp</a>
      <a href="index.html">Till startsidan</a>
    </footer>

  </main>

  <script>
    const questions = [
      {
        category: "Växter",
        question: "Vad behöver en växt för att kunna fotosyntetisera?",
        answers: [
          "Ljus, vatten och koldioxid",
          "Bara jord och syre",
          "Bara vatten och socker",
          "Mörker och koldioxid"
        ],
        correct: 0,
        explanation:
          "Växten använder ljus, vatten och koldioxid. " +
          "Fotosyntesen bildar socker och syre."
      },

      {
        category: "Växter",
        question: "Vilken del av växten tar oftast upp vatten från marken?",
        answers: [
          "Blomman",
          "Rötterna",
          "Bladen",
          "Frukten"
        ],
        correct: 1,
        explanation:
          "Rötterna tar upp vatten och mineralämnen från marken."
      },

      {
        category: "Växter",
        question: "Vad är ett frö?",
        answers: [
          "En liten sten",
          "En del av marken",
          "En struktur som kan utvecklas till en ny växt",
          "Ett färdigt träd"
        ],
        correct: 2,
        explanation:
          "Ett frö innehåller ett växtembryo och kan gro under rätt förhållanden."
      },

      {
        category: "Celler",
        question: "Vad är en cell?",
        answers: [
          "En sorts blomma",
          "En byggsten i levande organismer",
          "En typ av jord",
          "En sorts mineral"
        ],
        correct: 1,
        explanation:
          "Cellen är en grundläggande byggsten hos levande organismer."
      },

      {
        category: "Celler",
        question: "Vilken struktur finns i växtceller men inte i djurceller?",
        answers: [
          "Cellmembran",
          "Cellkärna",
          "Cellvägg",
          "Cytoplasma"
        ],
        correct: 2,
        explanation:
          "Växtceller har en cellvägg som ger stadga. " +
          "Djurceller saknar cellvägg."
      },

      {
        category: "Djur",
        question: "Vad menas med att ett djur är anpassat till sin miljö?",
        answers: [
          "Att djuret alltid lever på samma plats",
          "Att egenskaper hjälper djuret att leva i miljön",
          "Att djuret aldrig behöver mat",
          "Att djuret kan ändra art"
        ],
        correct: 1,
        explanation:
          "En anpassning kan hjälpa ett djur att hitta mat, " +
          "skydd eller överleva i sin miljö."
      },

      {
        category: "Ekologi",
        question: "Vad är ett ekosystem?",
        answers: [
          "Bara växterna i en skog",
          "Bara djuren i en sjö",
          "Organismerna och den miljö de lever i",
          "En enda art"
        ],
        correct: 2,
        explanation:
          "Ett ekosystem består av organismer och den miljö " +
          "som de samspelar med."
      },

      {
        category: "Ekologi",
        question: "Vad är en producent i en näringskedja?",
        answers: [
          "En organism som tillverkar sin egen näring",
          "Ett djur som äter andra djur",
          "En svamp som bryter ner material",
          "En organism som alltid är störst"
        ],
        correct: 0,
        explanation:
          "Växter är producenter. De kan använda fotosyntesen " +
          "för att bilda energirikt socker."
      },

      {
        category: "Ekologi",
        question: "Vad gör nedbrytare?",
        answers: [
          "Tillverkar solljus",
          "Bryter ner döda organismer och rester",
          "Stoppar fotosyntesen",
          "Gör vatten till jord"
        ],
        correct: 1,
        explanation:
          "Nedbrytare, till exempel svampar och bakterier, " +
          "bryter ner dött organiskt material."
      },

      {
        category: "Evolution",
        question: "Vad betyder evolution?",
        answers: [
          "Att en individ växer",
          "Att vädret ändras",
          "Att populationer förändras över generationer",
          "Att alla djur blir likadana"
        ],
        correct: 2,
        explanation:
          "Evolution handlar om förändringar i ärftliga egenskaper " +
          "hos populationer över generationer."
      },

      {
        category: "Evolution",
        question: "Vad är en ärftlig egenskap?",
        answers: [
          "En egenskap som kan föras vidare från föräldrar till avkomma",
          "En egenskap som alltid beror på träning",
          "En egenskap som bara finns hos växter",
          "En egenskap som försvinner direkt"
        ],
        correct: 0,
        explanation:
          "Ärftliga egenskaper kan föras vidare genom genetiskt material."
      },

      {
        category: "Undersökningar",
        question: "Vad är en hypotes?",
        answers: [
          "Ett resultat",
          "En fråga utan svar",
          "En gissning som inte går att undersöka",
          "En förutsägelse som kan undersökas"
        ],
        correct: 3,
        explanation:
          "En hypotes är en förutsägelse som kan prövas genom en undersökning."
      },

      {
        category: "Undersökningar",
        question: "Varför gör man observationer?",
        answers: [
          "För att hitta på resultat",
          "För att samla information om det man undersöker",
          "För att slippa dokumentera",
          "För att alltid få samma resultat"
        ],
        correct: 1,
        explanation:
          "Observationer hjälper oss att samla information " +
          "om det som händer."
      },

      {
        category: "Undersökningar",
        question: "Vad ska en slutsats bygga på?",
        answers: [
          "Vad man hoppas ska hända",
          "En kompis svar",
          "Undersökningens resultat",
          "En slumpmässig gissning"
        ],
        correct: 2,
        explanation:
          "En slutsats ska bygga på resultatet och kopplas till frågan."
      },

      {
        category: "Natur",
        question: "Vad är biologisk mångfald?",
        answers: [
          "Variation av liv",
          "Bara många träd",
          "Bara olika sorters fåglar",
          "En sorts växt"
        ],
        correct: 0,
        explanation:
          "Biologisk mångfald handlar om variationen av liv, " +
          "till exempel arter och ekosystem."
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    const questionNumber = document.getElementById("questionNumber");
    const questionText = document.getElementById("questionText");
    const answerList = document.getElementById("answerList");
    const feedback = document.getElementById("feedback");
    const nextButton = document.getElementById("nextButton");
    const progressBar = document.getElementById("progressBar");
    const progressText = document.getElementById("progressText");
    const questionCard = document.getElementById("questionCard");
    const resultCard = document.getElementById("resultCard");
    const resultScore = document.getElementById("resultScore");
    const resultMessage = document.getElementById("resultMessage");
    const restartButton = document.getElementById("restartButton");

    function showQuestion() {
      answered = false;

      const question = questions[currentQuestion];

      questionNumber.textContent =
        "FRÅGA " + (currentQuestion + 1) + " · " + question.category;

      questionText.textContent = question.question;

      answerList.innerHTML = "";
      feedback.textContent = "";
      feedback.className = "feedback";

      nextButton.disabled = true;

      nextButton.textContent =
        currentQuestion === questions.length - 1
          ? "Visa resultat"
          : "Nästa fråga";

      progressText.textContent =
        "Fråga " + (currentQuestion + 1) +
        " av " + questions.length;

      progressBar.style.width =
        (currentQuestion / questions.length * 100) + "%";

      question.answers.forEach((answer, index) => {
        const button = document.createElement("button");

        button.type = "button";
        button.className = "answer-button";
        button.textContent =
          String.fromCharCode(65 + index) + ". " + answer;

        button.addEventListener("click", () => {
          checkAnswer(index, button);
        });

        answerList.appendChild(button);
      });
    }

    function checkAnswer(selectedIndex, selectedButton) {
      if (answered) return;

      answered = true;

      const question = questions[currentQuestion];
      const buttons = answerList.querySelectorAll("button");

      buttons.forEach(button => {
        button.disabled = true;
      });

      const correctButton = buttons[question.correct];

      if (selectedIndex === question.correct) {
        score++;

        selectedButton.classList.add("correct");

        feedback.className = "feedback visible good";
        feedback.textContent =
          "Rätt svar! " + question.explanation;
      } else {
        selectedButton.classList.add("incorrect");
        correctButton.classList.add("correct");

        feedback.className = "feedback visible try-again";
        feedback.textContent =
          "Inte riktigt. Rätt svar är: " +
          question.answers[question.correct] +
          ". " + question.explanation;
      }

      nextButton.disabled = false;
    }

    function showResult() {
      questionCard.style.display = "none";
      resultCard.classList.add("visible");

      progressBar.style.width = "100%";
      progressText.textContent = "Testet är klart!";

      resultScore.textContent =
        score + " av " + questions.length + " rätt";

      const percentage = Math.round(
        score / questions.length * 100
      );

      if (percentage === 100) {
        resultMessage.textContent =
          "Fantastiskt! Du svarade rätt på alla frågor.";
      } else if (percentage >= 80) {
        resultMessage.textContent =
          "Mycket bra! Du har god koll på biologin.";
      } else if (percentage >= 60) {
        resultMessage.textContent =
          "Bra arbete! Träna gärna vidare på några begrepp.";
      } else {
        resultMessage.textContent =
          "Fortsätt träna! Läs biologisidorna och försök igen.";
      }

      try {
        localStorage.setItem(
          "noUpptackarenBiologitestResultat",
          JSON.stringify({
            score: score,
            total: questions.length,
            percentage: percentage,
            date: new Date().toISOString()
          })
        );
      } catch (error) {
        console.log("Resultatet kunde inte sparas i webbläsaren.");
      }
    }

    nextButton.addEventListener("click", () => {
      if (!answered) return;

      if (currentQuestion < questions.length - 1) {
        currentQuestion++;
        showQuestion();
      } else {
        showResult();
      }
    });

    restartButton.addEventListener("click", () => {
      currentQuestion = 0;
      score = 0;
      answered = false;

      questionCard.style.display = "block";
      resultCard.classList.remove("visible");

      showQuestion();
    });

    showQuestion();
  </script>
</body>
</html>
