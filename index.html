<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NO-Upptäckaren</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .welcome {
            background: white;
            border-radius: 20px;
            padding: 35px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .welcome h2 {
            font-size: 30px;
            margin-bottom: 15px;
        }

        .welcome p {
            font-size: 18px;
            line-height: 1.6;
        }

        .subjects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .subject {
            display: block;
            background: white;
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            text-decoration: none;
            color: #18332a;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .subject:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.14);
        }

        .subject .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .subject h3 {
            font-size: 23px;
            margin-bottom: 10px;
        }

        .subject p {
            color: #52665d;
            line-height: 1.5;
        }

        .grade {
            border-top: 7px solid #16a34a;
        }

        .coming {
            border-top: 7px solid #94a3b8;
        }

    </style>

</head>

<body>

<header>

    <h1>🔬 NO-UPPTÄCKAREN</h1>

    <p>
        Din interaktiva NO-värld
    </p>

</header>


<main>


    <section class="welcome">

        <h2>👋 Välkommen, forskare!</h2>

        <p>
            Här får du utforska biologi, kemi, fysik och teknik
            genom texter, undersökningar, begrepp, frågor och quiz.
        </p>

    </section>


    <section class="subjects">


        <a href="ak4.html" class="subject grade">

            <div class="icon">
                🔬
            </div>

            <h3>Årskurs 4</h3>

            <p>
                Utforska NO för årskurs 4.
            </p>

        </a>


        <div class="subject coming">

            <div class="icon">
                🧪
            </div>

            <h3>Årskurs 5</h3>

            <p>
                Kommer snart.
            </p>

        </div>


        <div class="subject coming">

            <div class="icon">
                ⚡
            </div>

            <h3>Årskurs 6</h3>

            <p>
                Kommer snart.
            </p>

        </div>


    </section>


</main>


<footer>

    NO-Upptäckaren

</footer>


</body>

</html>
